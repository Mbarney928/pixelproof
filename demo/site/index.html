<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop · Lumen Supply</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="layout.js"></script>
  </head>
  <body class="page-shop">
    <div class="promo">Free shipping on orders over $50 this week</div>
    <header>
      <strong>Lumen Supply</strong>
      <nav>
        <a href="index.html">Shop</a><a href="pricing.html">Plans</a><a href="checkout.html">Checkout</a

    <main>
      <h1>Desk lamps that last</h1>
      <p class="lead">Hand-finished lamps, shipped flat and assembled in minutes.</p>

        <div class="card">
          <div class="swatch" style="background: #d9c7a3"></div>

          <p class="price">$64</p>
          <button class="btn">Add to cart</button>
        </div>
        <div class="card">
          <div class="swatch" style="background: #c9a7a0"></div>
          <h2>Clip Light</h2>
          <p class="lead">Fits any shelf edge.</p>
          <p class="price">$29</p>
          <button class="btn">Add to cart</button>
        </div>
      </div>
