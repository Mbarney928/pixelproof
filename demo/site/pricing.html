<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plans · Lumen Supply</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="layout.js"></script>
  </head>
  <body>
    <div class="promo">Free shipping on orders over $50 this week</div>
    <header>
      <strong>Lumen Supply</strong>
      <nav>
        <a href="index.html">Shop</a><a href="pricing.html">Plans</a><a href="checkout.html">Checkout</a
        ><a href="components.html">UI kit</a>
      </nav>
    </header>
    <main>
      <h1>Care plans</h1>
      <p class="lead">Extend your warranty and get free replacement bulbs.</p>
      <div class="grid">
        <div class="card">
          <h2>Basic</h2>
          <p class="price">$0</p>
          <p class="lead">One-year warranty.</p>
          <button class="btn secondary">Current plan</button>
        </div>
        <div class="card popular">
          <span class="badge">Most popular</span>
          <h2>Pro</h2>
          <p class="price price-pro">$32</p>
          <p class="lead">Three years, free bulbs.</p>
          <button class="btn">Choose Pro</button>
        </div>
        <div class="card">
          <h2>Studio</h2>
          <p class="price">$79</p>
          <p class="lead">Five years, priority repairs.</p>
          <button class="btn secondary">Contact us</button>
        </div>
      </div>
    </main>
  </body>
</html>
